name: xinghui_companion
description: Windows local-first fictional AI companion.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  get_storage: ^2.1.1
  image_picker: 1.1.2
  image: ^4.5.4
  google_fonts: 6.3.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - config/bubbles.yaml
    - assets/characters/
    - assets/theme.yaml
    - assets/persona/
    - assets/fonts/
    - assets/data/
