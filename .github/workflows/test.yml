name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: test-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.eval_persona
      - uses: actions/upload-artifact@v4
        with:
          name: persona-eval-report
          path: docs/persona_eval_report.md
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client/flutter_app
      - run: dart format lib test
        working-directory: client/flutter_app
      - run: flutter analyze --no-fatal-infos
        working-directory: client/flutter_app
      - run: flutter test
        working-directory: client/flutter_app
