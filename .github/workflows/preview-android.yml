name: Android Preview APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: python -m unittest discover -s tests -v
      - run: python scripts/bootstrap_flutter.py
      - run: flutter pub get
        working-directory: client/flutter_app
      - run: flutter analyze --no-fatal-infos
        working-directory: client/flutter_app
      - run: flutter test
        working-directory: client/flutter_app
      - name: Build clearly labelled development preview
        run: flutter build apk --debug
        working-directory: client/flutter_app
      - name: Stage preview and checksums
        run: |
          mkdir -p preview-out
          cp client/flutter_app/build/app/outputs/flutter-apk/app-debug.apk preview-out/xinghui-android-preview.apk
          python scripts/check_artifacts.py preview-out
          cd preview-out
          sha256sum xinghui-android-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: preview-out/*
          if-no-files-found: error
      - name: Publish preview APK (not production release)
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: android-preview-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$PREVIEW_TAG" preview-out/xinghui-android-preview.apk preview-out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Android 免费规则预览 $PREVIEW_TAG" --notes-file docs/android-preview.md
