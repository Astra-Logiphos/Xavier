name: Build Windows
on:
  pull_request:
    paths:
      - "client/**"
      - "scripts/**"
      - "server/**"
      - "tests/**"
      - "*.bat"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: 'validate or explicitly approved first base'
        type: choice
        options: [validate, first_base, backend_patch, frontend_patch]
        default: validate
      patch_batch:
        description: 'Frontend patch batch'
        type: choice
        options: [m15-b2, m15-b2a, m15-b4]
        default: m15-b4
  workflow_call:
permissions:
  contents: read
jobs:
  backend-patch:
    if: github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'backend_patch' && github.ref == 'refs/heads/codex/m145'
    uses: ./.github/workflows/build-backend-patch.yml
    permissions:
      contents: write
  windows:
    if: inputs.delivery_mode != 'backend_patch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python scripts/run_backend_tests.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: python scripts/bootstrap_flutter.py
      - run: flutter pub get
        working-directory: client/flutter_app
      - run: flutter analyze
        working-directory: client/flutter_app
      - run: flutter test
        working-directory: client/flutter_app
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-screenshots
          path: runtime/ui-checks/*.png
          if-no-files-found: error
      - name: Windows profile VM Service timeline capture
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'frontend_patch' && inputs.patch_batch == 'm15-b2'
        run: python scripts/profile_windows.py
      - run: flutter build windows --release
        working-directory: client/flutter_app
      - name: Bundle Visual C++ runtime from hosted runner redistributables
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found' }
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1
          if (-not $crt) { throw 'App-local release CRT directory missing' }
          $bundle = 'client/flutter_app/build/windows/x64/runner/Release'
          Copy-Item "$($crt.FullName)/*.dll" $bundle
          foreach ($name in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            if (-not (Test-Path "$bundle/$name")) { throw "Required runtime $name missing" }
          }
          Copy-Item 'docs/windows-runtime-notice.txt' "$bundle/第三方运行库说明.txt"
      - name: Verify desktop process can start on hosted Windows
        shell: pwsh
        run: |
          $exe = Resolve-Path 'client/flutter_app/build/windows/x64/runner/Release/xinghui_companion.exe'
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) { throw "Desktop exited during startup (exit $($app.ExitCode))" }
          Stop-Process -Id $app.Id
          Write-Output 'Hosted Windows startup smoke check passed; not a visual device test'
      - name: Verify native one-minute Windows notification scheduling
        shell: pwsh
        run: |
          $exe = Resolve-Path 'client/flutter_app/build/windows/x64/runner/Release/xinghui_companion.exe'
          $app = Start-Process -FilePath $exe -ArgumentList '--notification-smoke' -PassThru
          $handle = $app.Handle
          if (-not $app.WaitForExit(90000)) { Stop-Process -Id $app.Id; throw 'Native notification smoke timed out' }
          Write-Output "Native smoke exit code: $($app.ExitCode)"
          if (Test-Path 'client/flutter_app/build/windows/x64/runner/Release/notification-smoke.json') { Get-Content 'client/flutter_app/build/windows/x64/runner/Release/notification-smoke.json' }
          if ($app.ExitCode -ne 0) { throw 'Native notification smoke failed; inspect notification-smoke.json' }
          $proof = Get-Content 'client/flutter_app/build/windows/x64/runner/Release/notification-smoke.json' | ConvertFrom-Json
          if (-not $proof.passed -or -not $proof.native_schedule_confirmed -or -not $proof.due_consumed) { throw 'Native notification evidence missing' }
          Write-Output 'Native Windows scheduled notification queued and consumed at due time; user banner visibility remains a device acceptance check'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-notification-evidence
          path: client/flutter_app/build/windows/x64/runner/Release/notification-smoke.json
          if-no-files-found: warn
      - name: Bundle local backend and portable Python
        run: python scripts/bundle_windows_backend.py client/flutter_app/build/windows/x64/runner/Release
      - name: Validate packaged local backend
        run: python scripts/smoke_windows_bundle.py client/flutter_app/build/windows/x64/runner/Release
      - name: Build and verify requested incremental frontend patch
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'frontend_patch' && github.ref == 'refs/heads/codex/m15'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        shell: pwsh
        run: |
          gh release download companion-preview-35-1 --repo $env:GITHUB_REPOSITORY --pattern m145-base.zip --dir prior-download
          if ($LASTEXITCODE -ne 0) { throw 'Base download failed' }
          gh release download m145-b1-preview-39-1 --repo $env:GITHUB_REPOSITORY --pattern m145-b1-patch.zip --dir prior-download
          if ($LASTEXITCODE -ne 0) { throw 'Predecessor download failed' }
          Expand-Archive prior-download/m145-base.zip previous-base
          Expand-Archive prior-download/m145-b1-patch.zip previous-patch
          $env:XINGHUI_INSTALL_ROOT = (Resolve-Path previous-base).Path
          $env:XINGHUI_PATCH_TEST = '1'
          cmd.exe /d /c (Resolve-Path 'previous-patch/apply_patch.bat').Path
          if ($LASTEXITCODE -ne 0) { throw 'Predecessor patch apply failed' }
          gh release download companion-preview-42-1 --repo $env:GITHUB_REPOSITORY --pattern m15-b1-patch.zip --dir prior-download
          if ($LASTEXITCODE -ne 0) { throw 'm15-b1 download failed' }
          Expand-Archive prior-download/m15-b1-patch.zip previous-b1
          cmd.exe /d /c (Resolve-Path 'previous-b1/apply_patch.bat').Path
          if ($LASTEXITCODE -ne 0) { throw 'm15-b1 predecessor apply failed' }
          if ('${{ inputs.patch_batch }}' -in @('m15-b2a','m15-b4')) {
            gh release download m15-b2 --repo $env:GITHUB_REPOSITORY --pattern m15-b2-patch.zip --dir prior-download
            if ($LASTEXITCODE -ne 0) { throw 'm15-b2 download failed' }
            Expand-Archive prior-download/m15-b2-patch.zip previous-b2
            cmd.exe /d /c (Resolve-Path 'previous-b2/apply_patch.bat').Path
            if ($LASTEXITCODE -ne 0) { throw 'm15-b2 predecessor apply failed' }
          }
          if ('${{ inputs.patch_batch }}' -eq 'm15-b4') {
            gh release download m15-b2a --repo $env:GITHUB_REPOSITORY --pattern m15-b2a-patch.zip --dir prior-download
            if ($LASTEXITCODE -ne 0) { throw 'm15-b2a download failed' }
            Expand-Archive prior-download/m15-b2a-patch.zip previous-b2a
            cmd.exe /d /c (Resolve-Path 'previous-b2a/apply_patch.bat').Path
            if ($LASTEXITCODE -ne 0) { throw 'm15-b2a predecessor apply failed' }
          }
          python -m scripts.build_frontend_patch previous-base client/flutter_app/build/windows/x64/runner/Release ${{ github.sha }} release-out ${{ inputs.patch_batch }}
          if ($LASTEXITCODE -ne 0) { throw 'Increment build failed' }
          python -m scripts.smoke_patch_bundle previous-base release-out/${{ inputs.patch_batch }}-patch.zip
          if ($LASTEXITCODE -ne 0) { throw 'Increment apply/revert failed' }
          python scripts/check_artifacts.py release-out
          if ($LASTEXITCODE -ne 0) { throw 'Artifact check failed' }
          if (Test-Path runtime/performance) { Copy-Item runtime/performance/*.json release-out }
          Write-Output "PATCH_BYTES $((Get-Item release-out/${{ inputs.patch_batch }}-patch.zip).Length)"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'frontend_patch' && github.ref == 'refs/heads/codex/m15'
        with:
          name: windows-release
          path: release-out/*
          if-no-files-found: error
      - name: Initialize first base and document demonstration patch
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'first_base' && github.ref == 'refs/heads/codex/m145'
        run: |
          python -m scripts.build_patch client/flutter_app/build/windows/x64/runner/Release ${{ github.sha }} release-out
          python -m scripts.smoke_patch_bundle client/flutter_app/build/windows/x64/runner/Release release-out/m145-b0-patch.zip
      - name: Package portable application
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'first_base' && github.ref == 'refs/heads/codex/m145'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          $bundle = 'client/flutter_app/build/windows/x64/runner/Release'
          if (-not (Test-Path $bundle)) { throw 'Windows output missing; SDK layout changed' }
          Copy-Item 'LICENSE' "$bundle/LICENSE.txt"
          Copy-Item 'docs/windows-quickstart.txt' "$bundle/使用说明.txt"
          if (Test-Path "$bundle/install-state.json") {
            Compress-Archive -Path "$bundle/*" -DestinationPath release-out/m145-base.zip
          } else {
            throw 'Full-package mode requires an approved first-base or reset workflow'
          }
          python scripts/check_artifacts.py release-out
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'first_base' && github.ref == 'refs/heads/codex/m145'
        with:
          name: windows-release
          path: release-out/*
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'workflow_dispatch' && ((inputs.delivery_mode == 'first_base' && github.ref == 'refs/heads/codex/m145') || (inputs.delivery_mode == 'frontend_patch' && github.ref == 'refs/heads/codex/m15'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: preview-out
      - uses: actions/download-artifact@v4
        if: inputs.delivery_mode == 'frontend_patch'
        with:
          name: ui-review-screenshots
          path: preview-shots
      - name: Publish desktop preview separately from signed production release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.delivery_mode == 'frontend_patch' && inputs.patch_batch || format('companion-preview-{0}-{1}', github.run_number, github.run_attempt) }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd preview-out
          if [ "${{ inputs.delivery_mode }}" = 'frontend_patch' ]; then
            sha256sum "${PREVIEW_TAG}-patch.zip" > SHA256SUMS.txt
            if [ "$PREVIEW_TAG" = 'm15-b4' ]; then
              gh release create "$PREVIEW_TAG" "${PREVIEW_TAG}-patch.zip" SHA256SUMS.txt ../preview-shots/m15-chat-light.png ../preview-shots/m15-chat-dark.png --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --prerelease --title "模块十五批次四：多模型本地配置向导" --notes-file ../docs/module-15-b4-acceptance.md
            elif [ "$PREVIEW_TAG" = 'm15-b2a' ]; then
              gh release create "$PREVIEW_TAG" "${PREVIEW_TAG}-patch.zip" SHA256SUMS.txt ../preview-shots/m15-chat-light.png ../preview-shots/m15-chat-dark.png --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --prerelease --title "批次二追加：双侧头像上传" --notes-file ../docs/module-15-b2a-acceptance.md
            else
              gh release create "$PREVIEW_TAG" m15-b2-patch.zip SHA256SUMS.txt performance-metrics.json devtools-timeline.json ../preview-shots/page-1.png ../preview-shots/m15-chat-light.png ../preview-shots/m15-chat-dark.png --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --prerelease --title "模块十五批次二：性能、头像与一键启动" --notes-file ../docs/module-15-b2-acceptance.md
            fi
            exit 0
          fi
          sha256sum m145-base.zip m145-b0-patch.zip > SHA256SUMS.txt
          gh release create "$PREVIEW_TAG" m145-base.zip m145-b0-patch.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --prerelease --title "Windows 桌面预览 $PREVIEW_TAG" --notes-file ../docs/module-145-b0-acceptance.md
