name: Build Android
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  android-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: python scripts/bootstrap_flutter.py
      - run: flutter pub get
        working-directory: client/flutter_app
      - name: Compile development APK only (not a release)
        run: flutter build apk --debug
        working-directory: client/flutter_app
  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/runtime/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Require signing secrets and materialize key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          names=['KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']
          if not all(os.getenv(n) for n in names): raise SystemExit('Missing Android signing secrets; no fake release will be built')
          p=Path(os.environ['ANDROID_KEYSTORE_PATH']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True)); p.chmod(0o600)
          PY
      - run: python scripts/bootstrap_flutter.py
      - run: flutter pub get
        working-directory: client/flutter_app
      - run: flutter analyze --no-fatal-infos
        working-directory: client/flutter_app
      - run: flutter test
        working-directory: client/flutter_app
      - run: flutter build apk --release
        working-directory: client/flutter_app
      - run: flutter build appbundle --release
        working-directory: client/flutter_app
      - name: Stage public files only
        run: |
          mkdir -p release-out
          cp client/flutter_app/build/app/outputs/flutter-apk/app-release.apk release-out/xinghui-android.apk
          cp client/flutter_app/build/app/outputs/bundle/release/app-release.aab release-out/xinghui-android.aab
          python scripts/check_artifacts.py release-out
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-out/*
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
