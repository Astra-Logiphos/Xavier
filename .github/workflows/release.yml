name: Release
on:
  push:
    tags:
      - 'v*'
      - 'm15-*'
permissions:
  contents: read
jobs:
  backend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.eval_persona
  # ---- m15-* 标签：自动出 patch.zip（+有签名密钥时的 release APK）并建 DRAFT Release ----
  prepare:
    if: startsWith(github.ref, 'refs/tags/m15-')
    runs-on: ubuntu-latest
    outputs:
      batch: ${{ steps.vars.outputs.batch }}
    steps:
      - id: vars
        run: |
          # 干跑标签约定后缀 -ci：m15-b4-ci → 批次 m15-b4
          batch="${GITHUB_REF_NAME%-ci}"
          case "$batch" in
            m15-b2|m15-b2a|m15-b3|m15-b3a|m15-b4) ;;
            *) echo "不支持的发布批次标签：$GITHUB_REF_NAME（支持 m15-b2/b2a/b3/b3a/b4）" >&2; exit 1 ;;
          esac
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
  android:
    needs: [backend-gate, prepare]
    if: startsWith(github.ref, 'refs/tags/m15-')
    # 与 draft 并行：仓库未配置 Android 签名 secrets 时本作业会明确失败
    # （不伪造签名包）；draft 不依赖它，草稿如实标注缺 APK。
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
  windows-patch:
    needs: [backend-gate, prepare]
    if: startsWith(github.ref, 'refs/tags/m15-')
    # build-windows 的嵌套发布作业要求 contents:write；调用方必须显式授予。
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      delivery_mode: frontend_patch
      patch_batch: ${{ needs.prepare.outputs.batch }}
  draft:
    if: startsWith(github.ref, 'refs/tags/m15-') && always() && needs.backend-gate.result == 'success' && needs.windows-patch.result == 'success'
    needs: [backend-gate, prepare, windows-patch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # windows-release 产物在嵌套的可复用 run 里；按本次 run 的子 run 定位下载。
      - name: Locate and download nested windows-release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CHILD=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="windows-patch / windows") | .run_id' | head -1)
          echo "child run: $CHILD"
          mkdir -p release-out
          gh run download "$CHILD" --repo "$GITHUB_REPOSITORY" -n windows-release -D release-out
          ls -la release-out
      - name: Detect signed Android release availability
        id: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHILD=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="android / android") | .run_id' | head -1)
          if [ -n "$CHILD" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHILD/artifacts" --jq '.artifacts[] | select(.name=="android-release") | .id' | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "child=$CHILD" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android 签名 secrets 未配置或构建失败：本次草稿不含 APK。" > ../release-note.txt
          fi
      - uses: actions/download-artifact@v4
        if: steps.android.outputs.available == 'true'
        with:
          run-id: ${{ steps.android.outputs.child }}
          github-token: ${{ github.token }}
          name: android-release
          path: release-out
      - name: Whitelist scan and checksums
        run: |
          # AAB 留在 Artifact（白名单外），草稿只收 APK
          rm -f release-out/*.aab
          ls -la release-out
          python scripts/check_release_assets.py release-out
          cd release-out
          sha256sum *.zip *.apk > SHA256SUMS.txt 2>/dev/null || sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create DRAFT release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ needs.prepare.outputs.batch }}
        run: |
          cd release-out
          ASSETS=""
          for f in *-patch.zip *.apk SHA256SUMS.txt; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done
          EXTRA_NOTE=""
          [ -f ../release-note.txt ] && EXTRA_NOTE=$(cat ../release-note.txt)
          gh release create "$GITHUB_REF_NAME" "SHA256SUMS.txt" $ASSETS \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --target "$GITHUB_SHA" \
            --title "草稿：星回 $BATCH 增量补丁" \
            --notes "自动生成的 DRAFT Release（未发布）。$EXTRA_NOTE
          核对 SHA256SUMS.txt 与资产清单后，由维护者在网页端手动点 Publish。"
  # ---- v* 标签：原有验证路径（publish 保持禁用） ----
  android-legacy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: backend-gate
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
  windows-legacy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: backend-gate
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
