name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  backend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.eval_persona
  android:
    needs: backend-gate
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
  windows:
    needs: backend-gate
    uses: ./.github/workflows/build-windows.yml
  publish:
    if: false # Legacy full-package publication disabled; use approved base/patch workflow.
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-out
          merge-multiple: true
      - run: python scripts/check_artifacts.py release-out
      - name: Checksums and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-out
          sha256sum xinghui-android.apk xinghui-android.aab xinghui-windows.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" xinghui-android.apk xinghui-android.aab xinghui-windows.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "星回 $GITHUB_REF_NAME" --generate-notes
